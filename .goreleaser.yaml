# GoReleaser configuration.
# https://goreleaser.com
version: 2
project_name: gitstatus
builds:
  - id: gitstatus
    main: .
    binary: gitstatus
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
    env:
      - CGO_ENABLED=0
archives:
  - id: default
    files:
      - README.md
      - LICENSE
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ .Tag }}-next'
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other Changes
      order: 999
homebrew_casks:
  - name: gitstatus
    directory: Casks
    repository:
      owner: icco
      name: homebrew-tap
    homepage: https://github.com/icco/gitstatus
    description: Git repository status as one line, for a shell prompt
    license: MIT
    binaries:
      - gitstatus
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gitstatus"]
          end
release:
  github:
    owner: icco
    name: gitstatus
  mode: replace
  footer: |
    ---
    Install with `brew install icco/tap/gitstatus`.

    **Full Changelog**: https://github.com/icco/gitstatus/compare/{{ .PreviousTag }}...{{ .Tag }}
